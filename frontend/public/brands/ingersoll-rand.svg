    <!-- Ingersoll Rand text -->
    <text x="66" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="24" fill="#d9251d" letter-spacing="-0.5px">Ingersoll Rand<tspan fill="#d9251d">.</tspan></text>
