  <rect width="280" height="160" fill="#ffffff" rx="6" />
  <!-- Red IR Oval Symbol -->
  <g transform="translate(30, 48)">
    <!-- Red circle / oval -->
    <ellipse cx="28" cy="32" rx="28" ry="24" fill="#d9251d" />
